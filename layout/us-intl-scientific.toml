  ["T"     , "Þ"],  # LATIN CAPITAL LETTER THORN
  ["O"     , "Œ"],  # LATIN CAPITAL LIGATURE OE
  ["&"     , "⅋"],  # TURNED AMPERSAND
  ["l"     , "ǉ"],  # LATIN SMALL LETTER LJ
  ["L"     , "Ǉ"],  # LATIN CAPITAL LETTER LJ
  ["e"     , "ð"],  # LATIN SMALL LETTER ETH
  ["E"     , "Ð"],  # LATIN CAPITAL LETTER ETH
  ["1"     , "ﬀ"],  # LATIN SMALL LIGATURE FF
  ["2"     , "ﬁ"],  # LATIN SMALL LIGATURE FI
  ["3"     , "ﬂ"],  # LATIN SMALL LIGATURE FL
  ["4"     , "ﬃ"],  # LATIN SMALL LIGATURE FFI
  ["5"     , "ﬄ"],  # LATIN SMALL LIGATURE FFL
  ["6"     , "ﬅ"],  # LATIN SMALL LIGATURE LONG S T
  ["7"     , "ﬆ"],  # LATIN SMALL LIGATURE ST
  ["H"     , "Ƕ"],  # LATIN CAPITAL LETTER HWAIR
  ["h"     , "ƕ"],  # LATIN SMALL LETTER HV
  ["*"     , "Ȣ"],  # LATIN CAPITAL LETTER OU
  ["8"     , "ȣ"],  # LATIN SMALL LETTER OU
  ["("     , "Ƣ"],  # LATIN CAPITAL LETTER OI
  ["9"     , "ƣ"],  # LATIN SMALL LETTER OI
  [")"     , "Ŋ"],  # LATIN CAPITAL LETTER ENG
  ["0"     , "ŋ"],  # LATIN SMALL LETTER ENG
