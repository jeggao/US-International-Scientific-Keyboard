# US-International Scientific keyboard layout, version 1.7.0.
#
# This file is the source of truth. Every shipped file -- the Windows .klc, the
# Linux XKB and Compose files -- is generated from it by tools/generate.py, and
# README.md is checked against it by tools/validate.py.
#
# A character is written either as itself or, when it is invisible or does not
# survive being pasted around (a space, a control character, a combining mark),
# as "U+XXXX". A shift state that starts a dead key is written { dead = "..." }.

[layout]
name = "US-International Scientific"
version = "1.7.0"
copyright = "(c) 2023 Daniel S Lai"
company = "Daniel S Lai"

[layout.windows]
dll_name = "KBDUSS7"
locale_name = "en-US"
locale_id = "00000409"
language_name = "English (United States)"
output_path = "US International Scientific.klc"
klc_version = "1.0"

[layout.linux]
symbols_file = "us_intl_sci"
variant = "sci"
description = "English (US, international scientific)"

[layout.macos]
id = -19001
output_path = "dist/macos/US-International Scientific.keylayout"
group = 126


# ---------------------------------------------------------------------------
# Keys, named by their ISO/IEC 9995 position, in reading order.
# ---------------------------------------------------------------------------

[[key]]  # grave/tilde
id = "TLDE"
normal = "`"  # GRAVE ACCENT
shift = "~"  # TILDE
altgr = { dead = "U+0300" }  # COMBINING GRAVE ACCENT
altgr_doc = "**Dead key: characters with the grave accent diacritic.** Shape similar to U+0060 GRAVE ACCENT (backtick). Retained from USX layout."
altgr_shift = { dead = "U+0303" }  # COMBINING TILDE
altgr_shift_doc = "**Dead key: characters with the tilde diacritic, extended to similar math equality symbols.** Shape similar to U+007E TILDE. Retained from USX layout."

[[key]]  # 1
id = "AE01"
normal = "1"  # DIGIT ONE
shift = "!"  # EXCLAMATION MARK
altgr = "′"  # PRIME
altgr_doc = "Math: first (1) derivative."
altgr_shift = "¡"  # INVERTED EXCLAMATION MARK
altgr_shift_doc = "Punctuation: used to begin exclamations in Spanish languages. Partially retained from USX layout, changed shift state for better accordance with U+0021 EXCLAMATION MARK."

[[key]]  # 2
id = "AE02"
normal = "2"  # DIGIT TWO
shift = "@"  # COMMERCIAL AT
altgr = "″"  # DOUBLE PRIME
altgr_doc = "Math: second (2) derivative."
altgr_shift = "√"  # SQUARE ROOT
altgr_shift_doc = "Math: second (2) root."

[[key]]  # 3
id = "AE03"
normal = "3"  # DIGIT THREE
shift = "#"  # NUMBER SIGN
altgr = "‴"  # TRIPLE PRIME
altgr_doc = "Math: third (3) derivative."
altgr_shift = "∛"  # CUBE ROOT
altgr_shift_doc = "Math: third (3) root."

[[key]]  # 4
id = "AE04"
normal = "4"  # DIGIT FOUR
shift = "$"  # DOLLAR SIGN
altgr = "¤"  # CURRENCY SIGN
altgr_doc = "Retained from USX layout. Related to the Shift shift state mapping of U+0024 DOLLAR SIGN."
altgr_shift = "£"  # POUND SIGN
altgr_shift_doc = "Retained from USX layout. Near other currency characters."

[[key]]  # 5
id = "AE05"
normal = "5"  # DIGIT FIVE
shift = "%"  # PERCENT SIGN
altgr = "€"  # EURO SIGN
altgr_doc = "Retained from USX layout. Near other currency characters."
altgr_shift = "‰"  # PER MILLE SIGN
altgr_shift_doc = "Shape and usage similar to U+0025 PERCENT SIGN on the same key."

[[key]]  # 6
id = "AE06"
normal = "6"  # DIGIT SIX
shift = "^"  # CIRCUMFLEX ACCENT
altgr = { dead = "U+030C" }  # COMBINING CARON
altgr_doc = "**Dead key: characters with the caron diacritic.** Mirror image of U+0302 COMBINING CIRCUMFLEX ACCENT."
altgr_shift = { dead = "U+0302" }  # COMBINING CIRCUMFLEX ACCENT
altgr_shift_doc = "**Dead key: characters with the circumflex diacritic.** Shape similar to U+005E CIRCUMFLEX ACCENT on the same key. Retained from USX layout."

[[key]]  # 7
id = "AE07"
normal = "7"  # DIGIT SEVEN
shift = "&"  # AMPERSAND
altgr = "U+20D7"  # COMBINING RIGHT ARROW ABOVE
altgr_doc = "Physics: vector notation. Shape of 7 similar to right arrow. Near other combining diacritical marks."
altgr_shift = { dead = "¦" }  # BROKEN BAR
altgr_shift_doc = "**Dead key: ligatures, extended to miscellaneous North European letters.** Usage of U+0026 AMPERSAND related to the fact that ligatures are joined characters. **Root character** is U+00A6 BROKEN BAR because 1) there is no valid and representative character in the set of ligatures, 2) it is an important character also covered in the USX layout, and 3) its shape suggests the idea of joining two objects. **Default character** is U+200D ZERO WIDTH JOINER, commonly used to compose composite graphemes, especially in emojis."

[[key]]  # 8
id = "AE08"
normal = "8"  # DIGIT EIGHT
shift = "*"  # ASTERISK
altgr = "∞"  # INFINITY
altgr_doc = "Math. Shape similar to a turned 8."
altgr_shift = { dead = "U+0307" }  # COMBINING DOT ABOVE
altgr_shift_doc = "**Dead key: characters with the overdot diacritic.** Shape indicates a dot-like mark raised above."

[[key]]  # 9
id = "AE09"
normal = "9"  # DIGIT NINE
shift = "("  # LEFT PARENTHESIS
altgr = "∝"  # PROPORTIONAL TO
altgr_doc = "Math. Near U+221E INFINITY. Shape similar to a turned 9, or a turned 8 with an opening."
altgr_shift = "⟨"  # MATHEMATICAL LEFT ANGLE BRACKET
altgr_shift_doc = "Physics: Bra-ket notation left bound. Shape and usage similar to U+0028 LEFT PARENTHESIS."

[[key]]  # 0
id = "AE10"
normal = "0"  # DIGIT ZERO
shift = ")"  # RIGHT PARENTHESIS
altgr = { dead = "U+030A" }  # COMBINING RING ABOVE
altgr_doc = "**Dead key: characters with a ring above, expanded to related non-math symbols.** Shape similar to 0, also the key is positioned at the top of the keyboard (Thus mapping to key <kbd>0</kbd> is prioritized over <kbd>O</kbd>)."
altgr_shift = "⟩"  # MATHEMATICAL RIGHT ANGLE BRACKET
altgr_shift_doc = "Physics: Bra-ket notation right bound. Shape and usage similar to U+0029 RIGHT PARENTHESIS."

[[key]]  # minus
id = "AE11"
normal = "-"  # HYPHEN-MINUS
shift = "_"  # LOW LINE
altgr = "–"  # EN DASH
altgr_doc = "Punctuation: commonly used as the dash indicating ranges of numbers. Shorter than U+2014 EM DASH, so mapped to the hyphen which is shorter than the underscore."
altgr_shift = "—"  # EM DASH
altgr_shift_doc = "Punctuation: commonly used as the dash indicating breaks in sentences. Longer than U+2013 EN DASH, so mapped to the underscore which is longer than the hyphen."

[[key]]  # equals
id = "AE12"
normal = "="  # EQUALS SIGN
shift = "+"  # PLUS SIGN
altgr = { dead = "ª" }  # FEMININE ORDINAL INDICATOR
altgr_doc = "**Dead key: subscript characters.** Conventionally, the hotkey for subscripts is <kbd>Ctrl</kbd> + <kbd>=</kbd> in rich text programs such as MS Word. Also, Unicode provides a full set of subscripts for numbers, which relates to the position of this key (at the top of the keyboard). **Root character and default character** is U+00AA FEMININE ORDINAL INDICATOR in pair with U+00BA MASCULINE ORDINAL INDICATOR, because they are essentially superscripts."
altgr_shift = { dead = "º" }  # MASCULINE ORDINAL INDICATOR
altgr_shift_doc = "**Dead key: superscript characters.** Conventionally, the hotkey for superscripts is <kbd>Ctrl</kbd> + <kbd>+</kbd> in rich text programs such as MS Word. Also, Unicode provides a full set of superscripts for numbers, which relates to the position of this key (at the top of the keyboard). **Root character and default character** is U+00BA MASCULINE ORDINAL INDICATOR in pair with U+00AA FEMININE ORDINAL INDICATOR, because they are essentially superscripts."

[[key]]  # Q
id = "AD01"
normal = "q"  # LATIN SMALL LETTER Q
shift = "Q"  # LATIN CAPITAL LETTER Q
altgr = "÷"  # DIVISION SIGN
altgr_doc = "Math. The result of division, quotient, starts with the letter \"q\". Has same shift state as U+00D7 MULTIPLICATION SIGN (mapped to key <kbd>x</kbd>), another common math operator."
altgr_shift = "≡"  # IDENTICAL TO
altgr_shift_doc = "Math: congruency, equivalence. Related to \"equality\", which has the letter \"q\". This symbol has a stronger mathematical meaning than U+00F7 DIVISION SIGN, and thus is mapped to the shifted shift state."

[[key]]  # W
id = "AD02"
normal = "w"  # LATIN SMALL LETTER W
shift = "W"  # LATIN CAPITAL LETTER W
altgr = "ϵ"  # GREEK LUNATE EPSILON SYMBOL
altgr_doc = "Shape similar to a turned \"w\". Key <kbd>e</kbd> is reserved for \"element of\"-related (set membership) symbols."
altgr_shift = { dead = "Ʃ" }  # LATIN CAPITAL LETTER ESH
altgr_shift_doc = "**Dead key: n-ary math operators.** Large math operators, such as summation, multiplication, and coproduct. **Root character and default character** is used in the African Alphabet, shape similar to capital letter sigma and turned letter \"W\". This pairs with key <kbd>I</kbd> mapped to U+0283 LATIN SMALL LETTER ESH. Key <kbd>E</kbd> is reserved for U+2203 THERE EXISTS, which resembles the letter \"E\" more."

[[key]]  # E
id = "AD03"
normal = "e"  # LATIN SMALL LETTER E
shift = "E"  # LATIN CAPITAL LETTER E
altgr = { dead = "϶" }  # GREEK REVERSED LUNATE EPSILON SYMBOL
altgr_doc = "**Dead key: set membership math symbols.** **Root character** has a shape similar to a reversed \"e\", and is near its mirror image U+03F5 GREEK LUNATE EPSILON SYMBOL. **Default character** is U+2208 ELEMENT OF, which starts with the letter \"e\"."
altgr_shift = "∃"  # THERE EXISTS
altgr_shift_doc = "Math: existential quantifier. Shape similar to a reversed letter \"E\"."

[[key]]  # R
id = "AD04"
normal = "r"  # LATIN SMALL LETTER R
shift = "R"  # LATIN CAPITAL LETTER R
altgr = "®"  # REGISTERED SIGN
altgr_doc = "Retained from USX layout. Shape includes letter \"R\". Shift state same as ℗ and ©."
altgr_shift = "™"  # TRADE MARK SIGN
altgr_shift_doc = "Usage highly related to U+00AE REGISTERED SIGN mapped to the same key."

[[key]]  # T
id = "AD05"
normal = "t"  # LATIN SMALL LETTER T
shift = "T"  # LATIN CAPITAL LETTER T
altgr = "†"  # DAGGER
altgr_doc = "Often used for marking footnotes, also used in math/physics for the conjugate (Hermitian) transpose. Shape similar to letter \"t\"."
altgr_shift = "‡"  # DOUBLE DAGGER
altgr_shift_doc = "Often used for marking footnotes, also used in chemistry to denote a transition state. Shape similar to letter \"t\" and U+2020 DAGGER mapped to the same key."

[[key]]  # Y
id = "AD06"
normal = "y"  # LATIN SMALL LETTER Y
shift = "Y"  # LATIN CAPITAL LETTER Y
altgr = { dead = "±" }  # PLUS-MINUS SIGN
altgr_doc = "**Dead key: math symbols comprised of horizontal and vertical lines, such as relational operators.** Shapes similar to the crossed shape of the letter \"y\", which also notes that the characters in this set could comprise of lines towards all directions. **Root character and default character** is U+00B1 PLUS-MINUS SIGN because it is most commonly used, and is the only character in this set which has a code point that is valid for a dead key."
altgr_shift = "¥"  # YEN SIGN
altgr_shift_doc = "Shape similar to letter \"Y\". Near other currency signs."

[[key]]  # U
id = "AD07"
normal = "u"  # LATIN SMALL LETTER U
shift = "U"  # LATIN CAPITAL LETTER U
altgr = "∪"  # UNION
altgr_doc = "Math: set notation. Shape similar to letter \"U\"."
altgr_shift = "∩"  # INTERSECTION
altgr_shift_doc = "Math: set notation. Mirror image of U+222A UNION mapped to the same key."

[[key]]  # I
id = "AD08"
normal = "i"  # LATIN SMALL LETTER I
shift = "I"  # LATIN CAPITAL LETTER I
altgr = "ı"  # LATIN SMALL LETTER DOTLESS I
altgr_doc = "Math: imaginary unit in some fields, eg. engineering. Also used in some languages, eg. Azerbaijani, Turkish. Shape similar to letter \"i\"."
altgr_shift = { dead = "ʃ" }  # LATIN SMALL LETTER ESH
altgr_shift_doc = "**Dead key: integral math symbols.** The name \"integral\" begins with the letter \"i\". Also integrals are large math operators, so they are mapped to capital key \"I\". **Root character and default character** is U+0283 LATIN SMALL LETTER ESH because it is a useful Latin letter that resembles an integral, while all integral characters in this set have code points that are invalid for a dead key."

[[key]]  # O
id = "AD09"
normal = "o"  # LATIN SMALL LETTER O
shift = "O"  # LATIN CAPITAL LETTER O
altgr = { dead = "ϕ" }  # GREEK PHI SYMBOL
altgr_doc = "**Dead key: circle-related math symbols.** Shapes include a circle, similar to shape of letter \"o\". **Root character and default character** is U+03D5 GREEK PHI SYMBOL, a common Greek variable name in math. Note for Greek language, U+03C6 GREEK SMALL LETTER PHI (φ) is used."
altgr_shift = "∅"  # EMPTY SET
altgr_shift_doc = "Math: set notation. Shape similar to letter \"O\" and U+03D5 GREEK PHI SYMBOL mapped to the same key."

[[key]]  # P
id = "AD10"
normal = "p"  # LATIN SMALL LETTER P
shift = "P"  # LATIN CAPITAL LETTER P
altgr = "℗"  # SOUND RECORDING COPYRIGHT
altgr_doc = "Also known as published phonorecord sign. Shape includes letter \"P\". Shift state same as ® and ©."
altgr_shift = "¶"  # PILCROW SIGN
altgr_shift_doc = "Typography: denotes a paragraph. Name starts with letter \"p\". Shape similar to reversed letter \"P\". Has same shift state as U+00A7 SECTION SIGN."

[[key]]  # left bracket
id = "AD11"
normal = "["  # LEFT SQUARE BRACKET
shift = "{"  # LEFT CURLY BRACKET
ctrl = "U+001B"  # ESCAPE
altgr = "‹"  # SINGLE LEFT-POINTING ANGLE QUOTATION MARK
altgr_doc = "Punctuation: left single quotation mark in some European languages. Used in pairs, similar to brackets. Shift state in accordance with single/double quotation marks."
altgr_shift = "«"  # LEFT-POINTING DOUBLE ANGLE QUOTATION MARK
altgr_shift_doc = "Punctuation: left double quotation mark in some European languages (eg. French guillemets). Used in pairs, similar to braces. Shift state in accordance with single/double quotation marks."

[[key]]  # right bracket
id = "AD12"
normal = "]"  # RIGHT SQUARE BRACKET
shift = "}"  # RIGHT CURLY BRACKET
ctrl = "U+001D"  # INFORMATION SEPARATOR THREE
altgr = "›"  # SINGLE RIGHT-POINTING ANGLE QUOTATION MARK
altgr_doc = "Punctuation: right single quotation mark in some European languages. Justification similar to U+2039 SINGLE LEFT-POINTING ANGLE QUOTATION MARK."
altgr_shift = "»"  # RIGHT-POINTING DOUBLE ANGLE QUOTATION MARK
altgr_shift_doc = "Punctuation: right double quotation mark in some European languages (eg. French guillemets). Justification similar to U+00AB LEFT-POINTING DOUBLE ANGLE QUOTATION MARK."

[[key]]  # A
id = "AC01"
normal = "a"  # LATIN SMALL LETTER A
shift = "A"  # LATIN CAPITAL LETTER A
altgr = { dead = "ɐ" }  # LATIN SMALL LETTER TURNED A
altgr_doc = "**Dead key: set inclusion math symbols.** Mainly mapped to this key in accordance with key mappings of set membership symbols and U+2203 THERE EXISTS to key <kbd>E</kbd>. U+2220 ANGLE is also included for its similar shape with these symbols and its name starting with letter \"a\". **Root character** has a shape similar to a turned \"a\". **Default character** is U+2282 SUBSET OF, which is representative."
altgr_shift = "∀"  # FOR ALL
altgr_shift_doc = "Math: universal quantifier. Shape similar to a turned letter \"A\"."

[[key]]  # S
id = "AC02"
normal = "s"  # LATIN SMALL LETTER S
shift = "S"  # LATIN CAPITAL LETTER S
altgr = "ß"  # LATIN SMALL LETTER SHARP S
altgr_doc = "Common letter in German language. Shape and usage similar to letter \"s\". Retained from USX layout."
altgr_shift = "§"  # SECTION SIGN
altgr_shift_doc = "Typography: denotes a section. Shape includes two letter \"S\"s. Retained from USX layout. Has same shift state as U+00B6 PILCROW SIGN."

[[key]]  # D
id = "AC03"
normal = "d"  # LATIN SMALL LETTER D
shift = "D"  # LATIN CAPITAL LETTER D
altgr = "∂"  # PARTIAL DIFFERENTIAL
altgr_doc = "Math: calculus. Shape is essentially a variant of letter \"d\"."
altgr_shift = "∆"  # INCREMENT
altgr_shift_doc = "Math: indicates the difference of the value of a variable resulting from change. Shape similar to Greek capital letter delta. Related to U+2202 PARTIAL DIFFERENTIAL mapped to the same key."

[[key]]  # F
id = "AC04"
normal = "f"  # LATIN SMALL LETTER F
shift = "F"  # LATIN CAPITAL LETTER F
altgr = "ϝ"  # GREEK SMALL LETTER DIGAMMA
altgr_doc = "Math: variable name. Shape similar to letter \"f\". Required to be included in UTR25."
altgr_shift = "Ϝ"  # GREEK LETTER DIGAMMA
altgr_shift_doc = "Math: variable name. Shape similar to letter \"F\". Required to be included in UTR25."

[[key]]  # G
id = "AC05"
normal = "g"  # LATIN SMALL LETTER G
shift = "G"  # LATIN CAPITAL LETTER G
altgr = { dead = "γ" }  # GREEK SMALL LETTER GAMMA
altgr_doc = "**Dead key: Greek letters, expanded to other math variable letters.** The name \"Greek\" starts with the letter \"g\". The base character mappings for this dead key are based on the Greek QWERTY keyboard layout. **Root character and default character** is U+03B3 GREEK SMALL LETTER GAMMA because it is the Greek version of letter \"g\", and also mapped so in the Greek QWERTY keyboard layout."
altgr_shift = "∇"  # NABLA
altgr_shift_doc = "Physics: differential operator. Describes gradient, which starts with letter \"g\". Similar to an inverted Greek capital delta, that also shares the same shift state with this character. Near other Greek letters."

[[key]]  # H
id = "AC06"
normal = "h"  # LATIN SMALL LETTER H
shift = "H"  # LATIN CAPITAL LETTER H
altgr = "ℏ"  # PLANCK CONSTANT OVER TWO PI
altgr_doc = "Physics: reduced Planck's constant. Shape similar to letter \"h\"."
altgr_shift = { dead = "Ħ" }  # LATIN CAPITAL LETTER H WITH STROKE
altgr_shift_doc = "**Dead key: letters with the mathematical Fraktur (Black-letter or Gothic) font.** Due to Windows limitations, only a few such letters are available. **Root character** is U+0126 LATIN CAPITAL LETTER H WITH STROKE only as a representation of the special font, while all Fraktur letters are not valid as dead key root characters; this character is by intent not mapped to a base character because it is only a placeholder and not a Fraktur letter. **Default character** is U+210C BLACK-LETTER CAPITAL H (ℌ), which is commonly used in physics for Hilbert space."

[[key]]  # J
id = "AC07"
normal = "j"  # LATIN SMALL LETTER J
shift = "J"  # LATIN CAPITAL LETTER J
altgr = "←"  # LEFTWARDS ARROW
altgr_doc = "Shape of letter \"J\" points to the left, similar to a mirror image of letter \"L\". Conventionally, many video websites (eg. YouTube) map rewind/pause/forward shortcuts to keys <kbd>J</kbd>, <kbd>K</kbd>, and <kbd>L</kbd>."
altgr_shift = "⇐"  # LEFTWARDS DOUBLE ARROW
altgr_shift_doc = "Justification similar to U+2190 LEFTWARDS ARROW. Mapped to shifted state because it is double-stroke, a variant of the single arrow."

[[key]]  # K
id = "AC08"
normal = "k"  # LATIN SMALL LETTER K
shift = "K"  # LATIN CAPITAL LETTER K
altgr = "↔"  # LEFT RIGHT ARROW
altgr_doc = "Letter \"K\" positioned between letters \"J\" and \"L\" mapped to the left and right arrows. Shape of letter \"K\" also points to two directions."
altgr_shift = "⇔"  # LEFT RIGHT DOUBLE ARROW
altgr_shift_doc = "Justification similar to U+2194 LEFT RIGHT ARROW. Mapped to shifted state because it is double-stroke, a variant of the single arrow."

[[key]]  # L
id = "AC09"
normal = "l"  # LATIN SMALL LETTER L
shift = "L"  # LATIN CAPITAL LETTER L
altgr = "→"  # RIGHTWARDS ARROW
altgr_doc = "Shape of letter \"L\" points to the right, similar to a mirror image of letter \"J\". Justification similar to U+2190 LEFTWARDS ARROW."
altgr_shift = "⇒"  # RIGHTWARDS DOUBLE ARROW
altgr_shift_doc = "Justification similar to U+2192 RIGHTWARDS ARROW. Mapped to shifted state because it is double-stroke, a variant of the single arrow."

[[key]]  # semicolon
id = "AC10"
normal = ";"  # SEMICOLON
shift = ":"  # COLON
altgr = "∴"  # THEREFORE
altgr_doc = "Math: indicates logical consequence in proofs, especially for geometry. Shape has multiple dots, similar to the colon and semicolon. In pair with U+2235 BECAUSE, but normally used after it, thus mapped to the non-shifted shift state."
altgr_shift = "∵"  # BECAUSE
altgr_shift_doc = "Math: indicates logical conditions in proofs, especially for geometry. Shape has multiple dots, similar to the colon and semicolon. In pair with U+2234 THEREFORE, but normally used first, thus mapped to the shifted shift state."

[[key]]  # apostrophe
id = "AC11"
normal = "'"  # APOSTROPHE
shift = "\""  # QUOTATION MARK
altgr = { dead = "U+0301" }  # COMBINING ACUTE ACCENT
altgr_doc = "**Dead key: characters with the acute accent diacritic.** Shape of apostrophe similar to acute accent. Retained from USX layout."
altgr_shift = { dead = "U+0308" }  # COMBINING DIAERESIS
altgr_shift_doc = "**Dead key: characters with the diaeresis diacritic, extended to diacritics with one or multiple dots.** Shape of quotation mark similar to diaeresis accent. Retained from USX layout."

[[key]]  # backslash
id = "BKSL"
normal = "\\"  # REVERSE SOLIDUS
shift = "|"  # VERTICAL LINE
ctrl = "U+001C"  # INFORMATION SEPARATOR FOUR
altgr = "↓"  # DOWNWARDS ARROW
altgr_doc = "Meaning related to U+005C REVERSE SOLIDUS (backslash) that indicates a falling notion. Mirror image of U+2191 UPWARDS ARROW."
altgr_shift = "↑"  # UPWARDS ARROW
altgr_shift_doc = "Shape similar to U+007C VERTICAL LINE mapped to this key. Indicates upward motion, which is related to the <kbd>Shift</kbd> key icon. Mirror image of U+2193 DOWNWARDS ARROW."

[[key]]  # Z
id = "AB01"
normal = "z"  # LATIN SMALL LETTER Z
shift = "Z"  # LATIN CAPITAL LETTER Z
altgr = "≠"  # NOT EQUAL TO
altgr_doc = "Math. Shape similar to letter \"z\". Has the same shift state as the equals sign (\"=\")."
altgr_shift = { dead = "Ƶ" }  # LATIN CAPITAL LETTER Z WITH STROKE
altgr_shift_doc = "**Dead key: letters with the mathematical double-struck font.** Due to Windows limitations, only a few such letters are available. **Root character** is U+01B5 LATIN CAPITAL LETTER Z WITH STROKE only as a representation of the special font, while all double-struck letters are not valid as dead key root characters; this character is by intent not mapped to a base character because it is only a placeholder and not a double-struck letter. **Default character** is U+2124 DOUBLE-STRUCK CAPITAL Z (ℤ), which is commonly used in math for the set of integers."

[[key]]  # X
id = "AB02"
normal = "x"  # LATIN SMALL LETTER X
shift = "X"  # LATIN CAPITAL LETTER X
altgr = "×"  # MULTIPLICATION SIGN
altgr_doc = "Math. Shape similar to letter \"x\". Has same shift state as U+00F7 DIVISION SIGN (mapped to key <kbd>q</kbd>), another common math operator."
altgr_shift = "≈"  # ALMOST EQUAL TO
altgr_shift_doc = "Math. Denotes approximation, which has the sound of letter \"x\". Has the same shift state as U+2261 IDENTICAL TO, both equality-related symbols."

[[key]]  # C
id = "AB03"
normal = "c"  # LATIN SMALL LETTER C
shift = "C"  # LATIN CAPITAL LETTER C
altgr = "©"  # COPYRIGHT SIGN
altgr_doc = "Shape includes letter \"c\". Retained from USX layout. Shift state same as ® and ℗."
altgr_shift = "¢"  # CENT SIGN
altgr_shift_doc = "Shape similar to letter \"c\". Similarly in a shifted shift state as the dollar sign. Retained from USX layout."

[[key]]  # V
id = "AB04"
normal = "v"  # LATIN SMALL LETTER V
shift = "V"  # LATIN CAPITAL LETTER V
altgr = "∨"  # LOGICAL OR
altgr_doc = "Math: logical operator. Shape similar to letter \"v\"."
altgr_shift = "∧"  # LOGICAL AND
altgr_shift_doc = "Math: logical operator, conjunction. Mirror image of U+2228 LOGICAL OR."

[[key]]  # B
id = "AB05"
normal = "b"  # LATIN SMALL LETTER B
shift = "B"  # LATIN CAPITAL LETTER B
altgr = { dead = "U+0304" }  # COMBINING MACRON
altgr_doc = "**Dead key: characters with the macron diacritic, extended to overline diacritics.** The shapes of these diacritics are usually called \"bars\" (especially in physics), which starts with letter \"b\". This key was originally intended for only U+0305 COMBINING OVERLINE for use in math and physics (denoting averages), then extended."
altgr_shift = { dead = "U+0306" }  # COMBINING BREVE
altgr_shift_doc = "**Dead key: characters with the breve diacritic.** The name \"breve\" starts with the letter \"b\"."

[[key]]  # N
id = "AB06"
normal = "n"  # LATIN SMALL LETTER N
shift = "N"  # LATIN CAPITAL LETTER N
altgr = "¬"  # NOT SIGN
altgr_doc = "Math: logical operator. The name \"not\" starts with letter \"n\"."
altgr_shift = "⊻"  # XOR
altgr_shift_doc = "Math: logical operator, exclusive disjunction. Expresses an alternative version of OR, so mapped to the same key as U+00AC NOT SIGN; but this does not mean that this is a negated version of OR (XOR is not NOR). Near other logical operators."

[[key]]  # M
id = "AB07"
normal = "m"  # LATIN SMALL LETTER M
shift = "M"  # LATIN CAPITAL LETTER M
altgr = "↦"  # RIGHTWARDS ARROW FROM BAR
altgr_doc = "Math: function notation. Commonly called the maplet, which starts with letter \"m\"."
altgr_shift = { dead = "µ" }  # MICRO SIGN
altgr_shift_doc = "**Dead key: letters with the mathematical script font.** Due to Windows limitations, only a few such letters are available. **Root character** is U+00B5 MICRO SIGN, whose name starts with letter \"m\". Itself is a deprecated symbol identical to Greek small letter mu (μ), and the latter should always be used. Here it is a placeholder, while all script letters are not valid as dead key root characters; this character is by intent not mapped to a base character because it is only a placeholder and not a script letter. **Default character** is U+2133 SCRIPT CAPITAL M (ℳ), which is the symbol for the M-matrix in physics, and the pre-WWII German Mark."

[[key]]  # comma
id = "AB08"
normal = ","  # COMMA
shift = "<"  # LESS-THAN SIGN
altgr = { dead = "U+0327" }  # COMBINING CEDILLA
altgr_doc = "**Dead key: characters with the cedilla or ogonek diacritic.** Shape of cedilla similar to the comma, while shape of ogonek similar to a reversed comma. The two diacritics are mutually exclusive on a letter, thus they are mapped to the same key."
altgr_shift = { dead = "<" }  # LESS-THAN SIGN
altgr_shift_doc = "**Dead key: variants of the less-than sign in math.** **Root character** is the plain less-than sign because all of its variants are not valid as dead key root characters. **Default character** is U+2264 LESS-THAN OR EQUAL TO as the most common and simple variant."

[[key]]  # period
id = "AB09"
normal = "."  # FULL STOP
shift = ">"  # GREATER-THAN SIGN
altgr = { dead = "U+0323" }  # COMBINING DOT BELOW
altgr_doc = "**Dead key: characters with the underdot diacritic, extended to punctuation with multiple dots.** Shape similar to the period. In accordance with $\\LaTeX$, includes the family of matrix abbreviators `\\cdot`, `\\cdots`, `\\vdots`, etc. **Default character** is the punctuation U+00B7 MIDDLE DOT (·), as there is no modifier letter for the below dot diacritic. Not to be confused with U+22C5 DOT OPERATOR (⋅), which should be used exclusively for dot multiplication in math."
altgr_shift = { dead = ">" }  # GREATER-THAN SIGN
altgr_shift_doc = "**Dead key: variants of the greater-than sign in math.** **Root character** is the plain greater-than sign because all of its variants are not valid as dead key root characters. **Default character** is U+2265 GREATER-THAN OR EQUAL TO as the most common and simple variant."

[[key]]  # slash
id = "AB10"
normal = "/"  # SOLIDUS
shift = "?"  # QUESTION MARK
altgr = { dead = "U+0338" }  # COMBINING LONG SOLIDUS OVERLAY
altgr_doc = "**Dead key: characters with a stroke.** Shape similar to the solidus. Standard combining character for \"crossing out\" other characters in Unicode. **Default character** is U+2044 FRACTION SLASH, which has a similar shape with the solidus, and also represents the usage of the solidus as the division operator."
altgr_shift = "¿"  # INVERTED QUESTION MARK
altgr_shift_doc = "Punctuation: used to begin interrogations in Spanish languages. Partially retained from USX layout, changed shift state for better accordance with U+003F QUESTION MARK."

[[key]]  # space bar
id = "SPCE"
normal = "U+0020"  # SPACE
shift = "U+0020"  # SPACE
ctrl = "U+0020"  # SPACE
altgr = "U+00A0"  # NO-BREAK SPACE
altgr_shift = "U+200B"  # ZERO WIDTH SPACE

[[key]]  # numeric keypad decimal
id = "KPDL"
normal = "."  # FULL STOP
shift = "."  # FULL STOP

[[key]]  # ISO extra key
id = "LSGT"
normal = "\\"  # REVERSE SOLIDUS
shift = "|"  # VERTICAL LINE
ctrl = "U+001C"  # INFORMATION SEPARATOR FOUR
altgr = "↓"  # DOWNWARDS ARROW
altgr_shift = "↑"  # UPWARDS ARROW


