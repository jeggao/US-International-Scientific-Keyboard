# US-International Scientific keyboard layout, version 1.7.0.
#
# This file is the source of truth. Every shipped file -- the Windows .klc, the
# Linux XKB and Compose files -- is generated from it by tools/generate.py, and
# README.md is checked against it by tools/validate.py.
#
# A character is written either as itself or, when it is invisible or does not
# survive being pasted around (a space, a control character, a combining mark),
# as "U+XXXX". A shift state that starts a dead key is written { dead = "..." }.

[layout]
name = "US-International Scientific"
version = "1.7.0"
copyright = "(c) 2023 Daniel S Lai"
company = "Daniel S Lai"

[layout.windows]
dll_name = "KBDUSS7"
locale_name = "en-US"
locale_id = "00000409"
language_name = "English (United States)"
output_path = "US International Scientific.klc"
klc_version = "1.0"

[layout.linux]
symbols_file = "us_intl_sci"
variant = "sci"
description = "English (US, international scientific)"

[layout.macos]
id = -19001
output_path = "dist/macos/US-International Scientific.keylayout"
group = 126


# ---------------------------------------------------------------------------
# Keys, named by their ISO/IEC 9995 position, in reading order.
# ---------------------------------------------------------------------------

[[key]]  # grave/tilde
id = "TLDE"
normal = "`"  # GRAVE ACCENT
shift = "~"  # TILDE
altgr = { dead = "U+0300" }  # COMBINING GRAVE ACCENT
altgr_shift = { dead = "U+0303" }  # COMBINING TILDE

[[key]]  # 1
id = "AE01"
normal = "1"  # DIGIT ONE
shift = "!"  # EXCLAMATION MARK
altgr = "′"  # PRIME
altgr_shift = "¡"  # INVERTED EXCLAMATION MARK

[[key]]  # 2
id = "AE02"
normal = "2"  # DIGIT TWO
shift = "@"  # COMMERCIAL AT
altgr = "″"  # DOUBLE PRIME
altgr_shift = "√"  # SQUARE ROOT

[[key]]  # 3
id = "AE03"
normal = "3"  # DIGIT THREE
shift = "#"  # NUMBER SIGN
altgr = "‴"  # TRIPLE PRIME
altgr_shift = "∛"  # CUBE ROOT

[[key]]  # 4
id = "AE04"
normal = "4"  # DIGIT FOUR
shift = "$"  # DOLLAR SIGN
altgr = "¤"  # CURRENCY SIGN
altgr_shift = "£"  # POUND SIGN

[[key]]  # 5
id = "AE05"
normal = "5"  # DIGIT FIVE
shift = "%"  # PERCENT SIGN
altgr = "€"  # EURO SIGN
altgr_shift = "‰"  # PER MILLE SIGN

[[key]]  # 6
id = "AE06"
normal = "6"  # DIGIT SIX
shift = "^"  # CIRCUMFLEX ACCENT
altgr = { dead = "U+030C" }  # COMBINING CARON
altgr_shift = { dead = "U+0302" }  # COMBINING CIRCUMFLEX ACCENT

[[key]]  # 7
id = "AE07"
normal = "7"  # DIGIT SEVEN
shift = "&"  # AMPERSAND
altgr = "U+20D7"  # COMBINING RIGHT ARROW ABOVE
altgr_shift = { dead = "¦" }  # BROKEN BAR

[[key]]  # 8
id = "AE08"
normal = "8"  # DIGIT EIGHT
shift = "*"  # ASTERISK
altgr = "∞"  # INFINITY
altgr_shift = { dead = "U+0307" }  # COMBINING DOT ABOVE

[[key]]  # 9
id = "AE09"
normal = "9"  # DIGIT NINE
shift = "("  # LEFT PARENTHESIS
altgr = "∝"  # PROPORTIONAL TO
altgr_shift = "⟨"  # MATHEMATICAL LEFT ANGLE BRACKET

[[key]]  # 0
id = "AE10"
normal = "0"  # DIGIT ZERO
shift = ")"  # RIGHT PARENTHESIS
altgr = { dead = "U+030A" }  # COMBINING RING ABOVE
altgr_shift = "⟩"  # MATHEMATICAL RIGHT ANGLE BRACKET

[[key]]  # minus
id = "AE11"
normal = "-"  # HYPHEN-MINUS
shift = "_"  # LOW LINE
altgr = "–"  # EN DASH
altgr_shift = "—"  # EM DASH

[[key]]  # equals
id = "AE12"
normal = "="  # EQUALS SIGN
shift = "+"  # PLUS SIGN
altgr = { dead = "ª" }  # FEMININE ORDINAL INDICATOR
altgr_shift = { dead = "º" }  # MASCULINE ORDINAL INDICATOR

[[key]]  # Q
id = "AD01"
normal = "q"  # LATIN SMALL LETTER Q
shift = "Q"  # LATIN CAPITAL LETTER Q
altgr = "÷"  # DIVISION SIGN
altgr_shift = "≡"  # IDENTICAL TO

[[key]]  # W
id = "AD02"
normal = "w"  # LATIN SMALL LETTER W
shift = "W"  # LATIN CAPITAL LETTER W
altgr = "ϵ"  # GREEK LUNATE EPSILON SYMBOL
altgr_shift = { dead = "Ʃ" }  # LATIN CAPITAL LETTER ESH

[[key]]  # E
id = "AD03"
normal = "e"  # LATIN SMALL LETTER E
shift = "E"  # LATIN CAPITAL LETTER E
altgr = { dead = "϶" }  # GREEK REVERSED LUNATE EPSILON SYMBOL
altgr_shift = "∃"  # THERE EXISTS

[[key]]  # R
id = "AD04"
normal = "r"  # LATIN SMALL LETTER R
shift = "R"  # LATIN CAPITAL LETTER R
altgr = "®"  # REGISTERED SIGN
altgr_shift = "™"  # TRADE MARK SIGN

[[key]]  # T
id = "AD05"
normal = "t"  # LATIN SMALL LETTER T
shift = "T"  # LATIN CAPITAL LETTER T
altgr = "†"  # DAGGER
altgr_shift = "‡"  # DOUBLE DAGGER

[[key]]  # Y
id = "AD06"
normal = "y"  # LATIN SMALL LETTER Y
shift = "Y"  # LATIN CAPITAL LETTER Y
altgr = { dead = "±" }  # PLUS-MINUS SIGN
altgr_shift = "¥"  # YEN SIGN

[[key]]  # U
id = "AD07"
normal = "u"  # LATIN SMALL LETTER U
shift = "U"  # LATIN CAPITAL LETTER U
altgr = "∪"  # UNION
altgr_shift = "∩"  # INTERSECTION

[[key]]  # I
id = "AD08"
normal = "i"  # LATIN SMALL LETTER I
shift = "I"  # LATIN CAPITAL LETTER I
altgr = "ı"  # LATIN SMALL LETTER DOTLESS I
altgr_shift = { dead = "ʃ" }  # LATIN SMALL LETTER ESH

[[key]]  # O
id = "AD09"
normal = "o"  # LATIN SMALL LETTER O
shift = "O"  # LATIN CAPITAL LETTER O
altgr = { dead = "ϕ" }  # GREEK PHI SYMBOL
altgr_shift = "∅"  # EMPTY SET

[[key]]  # P
id = "AD10"
normal = "p"  # LATIN SMALL LETTER P
shift = "P"  # LATIN CAPITAL LETTER P
altgr = "℗"  # SOUND RECORDING COPYRIGHT
altgr_shift = "¶"  # PILCROW SIGN

[[key]]  # left bracket
id = "AD11"
normal = "["  # LEFT SQUARE BRACKET
shift = "{"  # LEFT CURLY BRACKET
ctrl = "U+001B"  # ESCAPE
altgr = "‹"  # SINGLE LEFT-POINTING ANGLE QUOTATION MARK
altgr_shift = "«"  # LEFT-POINTING DOUBLE ANGLE QUOTATION MARK

[[key]]  # right bracket
id = "AD12"
normal = "]"  # RIGHT SQUARE BRACKET
shift = "}"  # RIGHT CURLY BRACKET
ctrl = "U+001D"  # INFORMATION SEPARATOR THREE
altgr = "›"  # SINGLE RIGHT-POINTING ANGLE QUOTATION MARK
altgr_shift = "»"  # RIGHT-POINTING DOUBLE ANGLE QUOTATION MARK

[[key]]  # A
id = "AC01"
normal = "a"  # LATIN SMALL LETTER A
shift = "A"  # LATIN CAPITAL LETTER A
altgr = { dead = "ɐ" }  # LATIN SMALL LETTER TURNED A
altgr_shift = "∀"  # FOR ALL

[[key]]  # S
id = "AC02"
normal = "s"  # LATIN SMALL LETTER S
shift = "S"  # LATIN CAPITAL LETTER S
altgr = "ß"  # LATIN SMALL LETTER SHARP S
altgr_shift = "§"  # SECTION SIGN

[[key]]  # D
id = "AC03"
normal = "d"  # LATIN SMALL LETTER D
shift = "D"  # LATIN CAPITAL LETTER D
altgr = "∂"  # PARTIAL DIFFERENTIAL
altgr_shift = "∆"  # INCREMENT

[[key]]  # F
id = "AC04"
normal = "f"  # LATIN SMALL LETTER F
shift = "F"  # LATIN CAPITAL LETTER F
altgr = "ϝ"  # GREEK SMALL LETTER DIGAMMA
altgr_shift = "Ϝ"  # GREEK LETTER DIGAMMA

[[key]]  # G
id = "AC05"
normal = "g"  # LATIN SMALL LETTER G
shift = "G"  # LATIN CAPITAL LETTER G
altgr = { dead = "γ" }  # GREEK SMALL LETTER GAMMA
altgr_shift = "∇"  # NABLA

[[key]]  # H
id = "AC06"
normal = "h"  # LATIN SMALL LETTER H
shift = "H"  # LATIN CAPITAL LETTER H
altgr = "ℏ"  # PLANCK CONSTANT OVER TWO PI
altgr_shift = { dead = "Ħ" }  # LATIN CAPITAL LETTER H WITH STROKE

[[key]]  # J
id = "AC07"
normal = "j"  # LATIN SMALL LETTER J
shift = "J"  # LATIN CAPITAL LETTER J
altgr = "←"  # LEFTWARDS ARROW
altgr_shift = "⇐"  # LEFTWARDS DOUBLE ARROW

[[key]]  # K
id = "AC08"
normal = "k"  # LATIN SMALL LETTER K
shift = "K"  # LATIN CAPITAL LETTER K
altgr = "↔"  # LEFT RIGHT ARROW
altgr_shift = "⇔"  # LEFT RIGHT DOUBLE ARROW

[[key]]  # L
id = "AC09"
normal = "l"  # LATIN SMALL LETTER L
shift = "L"  # LATIN CAPITAL LETTER L
altgr = "→"  # RIGHTWARDS ARROW
altgr_shift = "⇒"  # RIGHTWARDS DOUBLE ARROW

[[key]]  # semicolon
id = "AC10"
normal = ";"  # SEMICOLON
shift = ":"  # COLON
altgr = "∴"  # THEREFORE
altgr_shift = "∵"  # BECAUSE

[[key]]  # apostrophe
id = "AC11"
normal = "'"  # APOSTROPHE
shift = "\""  # QUOTATION MARK
altgr = { dead = "U+0301" }  # COMBINING ACUTE ACCENT
altgr_shift = { dead = "U+0308" }  # COMBINING DIAERESIS

[[key]]  # backslash
id = "BKSL"
normal = "\\"  # REVERSE SOLIDUS
shift = "|"  # VERTICAL LINE
ctrl = "U+001C"  # INFORMATION SEPARATOR FOUR
altgr = "↓"  # DOWNWARDS ARROW
altgr_shift = "↑"  # UPWARDS ARROW

[[key]]  # Z
id = "AB01"
normal = "z"  # LATIN SMALL LETTER Z
shift = "Z"  # LATIN CAPITAL LETTER Z
altgr = "≠"  # NOT EQUAL TO
altgr_shift = { dead = "Ƶ" }  # LATIN CAPITAL LETTER Z WITH STROKE

[[key]]  # X
id = "AB02"
normal = "x"  # LATIN SMALL LETTER X
shift = "X"  # LATIN CAPITAL LETTER X
altgr = "×"  # MULTIPLICATION SIGN
altgr_shift = "≈"  # ALMOST EQUAL TO

[[key]]  # C
id = "AB03"
normal = "c"  # LATIN SMALL LETTER C
shift = "C"  # LATIN CAPITAL LETTER C
altgr = "©"  # COPYRIGHT SIGN
altgr_shift = "¢"  # CENT SIGN

[[key]]  # V
id = "AB04"
normal = "v"  # LATIN SMALL LETTER V
shift = "V"  # LATIN CAPITAL LETTER V
altgr = "∨"  # LOGICAL OR
altgr_shift = "∧"  # LOGICAL AND

[[key]]  # B
id = "AB05"
normal = "b"  # LATIN SMALL LETTER B
shift = "B"  # LATIN CAPITAL LETTER B
altgr = { dead = "U+0304" }  # COMBINING MACRON
altgr_shift = { dead = "U+0306" }  # COMBINING BREVE

[[key]]  # N
id = "AB06"
normal = "n"  # LATIN SMALL LETTER N
shift = "N"  # LATIN CAPITAL LETTER N
altgr = "¬"  # NOT SIGN
altgr_shift = "⊻"  # XOR

[[key]]  # M
id = "AB07"
normal = "m"  # LATIN SMALL LETTER M
shift = "M"  # LATIN CAPITAL LETTER M
altgr = "↦"  # RIGHTWARDS ARROW FROM BAR
altgr_shift = { dead = "µ" }  # MICRO SIGN

[[key]]  # comma
id = "AB08"
normal = ","  # COMMA
shift = "<"  # LESS-THAN SIGN
altgr = { dead = "U+0327" }  # COMBINING CEDILLA
altgr_shift = { dead = "<" }  # LESS-THAN SIGN

[[key]]  # period
id = "AB09"
normal = "."  # FULL STOP
shift = ">"  # GREATER-THAN SIGN
altgr = { dead = "U+0323" }  # COMBINING DOT BELOW
altgr_shift = { dead = ">" }  # GREATER-THAN SIGN

[[key]]  # slash
id = "AB10"
normal = "/"  # SOLIDUS
shift = "?"  # QUESTION MARK
altgr = { dead = "U+0338" }  # COMBINING LONG SOLIDUS OVERLAY
altgr_shift = "¿"  # INVERTED QUESTION MARK

[[key]]  # space bar
id = "SPCE"
normal = "U+0020"  # SPACE
shift = "U+0020"  # SPACE
ctrl = "U+0020"  # SPACE
altgr = "U+00A0"  # NO-BREAK SPACE
altgr_shift = "U+200B"  # ZERO WIDTH SPACE

[[key]]  # numeric keypad decimal
id = "KPDL"
normal = "."  # FULL STOP
shift = "."  # FULL STOP

[[key]]  # ISO extra key
id = "LSGT"
normal = "\\"  # REVERSE SOLIDUS
shift = "|"  # VERTICAL LINE
ctrl = "U+001C"  # INFORMATION SEPARATOR FOUR
altgr = "↓"  # DOWNWARDS ARROW
altgr_shift = "↑"  # UPWARDS ARROW


# ---------------------------------------------------------------------------
# Dead keys, in the order the keys above declare them. Each maps U+0020 to its
# default character.
# ---------------------------------------------------------------------------

[[dead_key]]  # Grave accents
root = "U+0300"  # COMBINING GRAVE ACCENT
category = "Grave accents"
xkb_leader = "dead_grave"
map = [
  ["a"     , "à"],  # LATIN SMALL LETTER A WITH GRAVE
  ["w"     , "ẁ"],  # LATIN SMALL LETTER W WITH GRAVE
  ["e"     , "è"],  # LATIN SMALL LETTER E WITH GRAVE
  ["u"     , "ù"],  # LATIN SMALL LETTER U WITH GRAVE
  ["i"     , "ì"],  # LATIN SMALL LETTER I WITH GRAVE
  ["y"     , "ỳ"],  # LATIN SMALL LETTER Y WITH GRAVE
  ["o"     , "ò"],  # LATIN SMALL LETTER O WITH GRAVE
  ["A"     , "À"],  # LATIN CAPITAL LETTER A WITH GRAVE
  ["W"     , "Ẁ"],  # LATIN CAPITAL LETTER W WITH GRAVE
  ["E"     , "È"],  # LATIN CAPITAL LETTER E WITH GRAVE
  ["U"     , "Ù"],  # LATIN CAPITAL LETTER U WITH GRAVE
  ["I"     , "Ì"],  # LATIN CAPITAL LETTER I WITH GRAVE
  ["Y"     , "Ỳ"],  # LATIN CAPITAL LETTER Y WITH GRAVE
  ["O"     , "Ò"],  # LATIN CAPITAL LETTER O WITH GRAVE
  ["N"     , "Ǹ"],  # LATIN CAPITAL LETTER N WITH GRAVE
  ["n"     , "ǹ"],  # LATIN SMALL LETTER N WITH GRAVE
  ["U+0020", "`"],  # GRAVE ACCENT
]

[[dead_key]]  # Tilde diacritic + math equality symbols
root = "U+0303"  # COMBINING TILDE
category = "Tilde diacritic + math equality symbols"
xkb_leader = "dead_tilde"
map = [
  ["="     , "≅"],  # APPROXIMATELY EQUAL TO
  ["n"     , "ñ"],  # LATIN SMALL LETTER N WITH TILDE
  ["v"     , "ṽ"],  # LATIN SMALL LETTER V WITH TILDE
  ["a"     , "ã"],  # LATIN SMALL LETTER A WITH TILDE
  ["e"     , "ẽ"],  # LATIN SMALL LETTER E WITH TILDE
  ["u"     , "ũ"],  # LATIN SMALL LETTER U WITH TILDE
  ["i"     , "ĩ"],  # LATIN SMALL LETTER I WITH TILDE
  ["y"     , "ỹ"],  # LATIN SMALL LETTER Y WITH TILDE
  ["o"     , "õ"],  # LATIN SMALL LETTER O WITH TILDE
  ["N"     , "Ñ"],  # LATIN CAPITAL LETTER N WITH TILDE
  ["V"     , "Ṽ"],  # LATIN CAPITAL LETTER V WITH TILDE
  ["A"     , "Ã"],  # LATIN CAPITAL LETTER A WITH TILDE
  ["E"     , "Ẽ"],  # LATIN CAPITAL LETTER E WITH TILDE
  ["U"     , "Ũ"],  # LATIN CAPITAL LETTER U WITH TILDE
  ["I"     , "Ĩ"],  # LATIN CAPITAL LETTER I WITH TILDE
  ["Y"     , "Ỹ"],  # LATIN CAPITAL LETTER Y WITH TILDE
  ["O"     , "Õ"],  # LATIN CAPITAL LETTER O WITH TILDE
  ["-"     , "≃"],  # ASYMPTOTICALLY EQUAL TO
  ["U+0020", "˜"],  # SMALL TILDE
]

[[dead_key]]  # Caron diacritic
root = "U+030C"  # COMBINING CARON
category = "Caron diacritic"
xkb_leader = "dead_caron"
map = [
  ["n"     , "ň"],  # LATIN SMALL LETTER N WITH CARON
  ["c"     , "č"],  # LATIN SMALL LETTER C WITH CARON
  ["z"     , "ž"],  # LATIN SMALL LETTER Z WITH CARON
  ["a"     , "ǎ"],  # LATIN SMALL LETTER A WITH CARON
  ["j"     , "ǰ"],  # LATIN SMALL LETTER J WITH CARON
  ["g"     , "ǧ"],  # LATIN SMALL LETTER G WITH CARON
  ["d"     , "ď"],  # LATIN SMALL LETTER D WITH CARON
  ["s"     , "š"],  # LATIN SMALL LETTER S WITH CARON
  ["l"     , "ľ"],  # LATIN SMALL LETTER L WITH CARON
  ["k"     , "ǩ"],  # LATIN SMALL LETTER K WITH CARON
  ["e"     , "ě"],  # LATIN SMALL LETTER E WITH CARON
  ["r"     , "ř"],  # LATIN SMALL LETTER R WITH CARON
  ["u"     , "ǔ"],  # LATIN SMALL LETTER U WITH CARON
  ["i"     , "ǐ"],  # LATIN SMALL LETTER I WITH CARON
  ["t"     , "ť"],  # LATIN SMALL LETTER T WITH CARON
  ["o"     , "ǒ"],  # LATIN SMALL LETTER O WITH CARON
  ["N"     , "Ň"],  # LATIN CAPITAL LETTER N WITH CARON
  ["C"     , "Č"],  # LATIN CAPITAL LETTER C WITH CARON
  ["Z"     , "Ž"],  # LATIN CAPITAL LETTER Z WITH CARON
  ["A"     , "Ǎ"],  # LATIN CAPITAL LETTER A WITH CARON
  ["G"     , "Ǧ"],  # LATIN CAPITAL LETTER G WITH CARON
  ["D"     , "Ď"],  # LATIN CAPITAL LETTER D WITH CARON
  ["S"     , "Š"],  # LATIN CAPITAL LETTER S WITH CARON
  ["L"     , "Ľ"],  # LATIN CAPITAL LETTER L WITH CARON
  ["K"     , "Ǩ"],  # LATIN CAPITAL LETTER K WITH CARON
  ["E"     , "Ě"],  # LATIN CAPITAL LETTER E WITH CARON
  ["R"     , "Ř"],  # LATIN CAPITAL LETTER R WITH CARON
  ["U"     , "Ǔ"],  # LATIN CAPITAL LETTER U WITH CARON
  ["I"     , "Ǐ"],  # LATIN CAPITAL LETTER I WITH CARON
  ["T"     , "Ť"],  # LATIN CAPITAL LETTER T WITH CARON
  ["O"     , "Ǒ"],  # LATIN CAPITAL LETTER O WITH CARON
  ["H"     , "Ȟ"],  # LATIN CAPITAL LETTER H WITH CARON
  ["h"     , "ȟ"],  # LATIN SMALL LETTER H WITH CARON
  ["U+0020", "ˇ"],  # CARON
]

[[dead_key]]  # Circumflex accents
root = "U+0302"  # COMBINING CIRCUMFLEX ACCENT
category = "Circumflex accents"
xkb_leader = "dead_circumflex"
map = [
  ["c"     , "ĉ"],  # LATIN SMALL LETTER C WITH CIRCUMFLEX
  ["a"     , "â"],  # LATIN SMALL LETTER A WITH CIRCUMFLEX
  ["h"     , "ĥ"],  # LATIN SMALL LETTER H WITH CIRCUMFLEX
  ["j"     , "ĵ"],  # LATIN SMALL LETTER J WITH CIRCUMFLEX
  ["g"     , "ĝ"],  # LATIN SMALL LETTER G WITH CIRCUMFLEX
  ["s"     , "ŝ"],  # LATIN SMALL LETTER S WITH CIRCUMFLEX
  ["w"     , "ŵ"],  # LATIN SMALL LETTER W WITH CIRCUMFLEX
  ["e"     , "ê"],  # LATIN SMALL LETTER E WITH CIRCUMFLEX
  ["u"     , "û"],  # LATIN SMALL LETTER U WITH CIRCUMFLEX
  ["i"     , "î"],  # LATIN SMALL LETTER I WITH CIRCUMFLEX
  ["y"     , "ŷ"],  # LATIN SMALL LETTER Y WITH CIRCUMFLEX
  ["o"     , "ô"],  # LATIN SMALL LETTER O WITH CIRCUMFLEX
  ["C"     , "Ĉ"],  # LATIN CAPITAL LETTER C WITH CIRCUMFLEX
  ["A"     , "Â"],  # LATIN CAPITAL LETTER A WITH CIRCUMFLEX
  ["H"     , "Ĥ"],  # LATIN CAPITAL LETTER H WITH CIRCUMFLEX
  ["J"     , "Ĵ"],  # LATIN CAPITAL LETTER J WITH CIRCUMFLEX
  ["G"     , "Ĝ"],  # LATIN CAPITAL LETTER G WITH CIRCUMFLEX
  ["S"     , "Ŝ"],  # LATIN CAPITAL LETTER S WITH CIRCUMFLEX
  ["W"     , "Ŵ"],  # LATIN CAPITAL LETTER W WITH CIRCUMFLEX
  ["E"     , "Ê"],  # LATIN CAPITAL LETTER E WITH CIRCUMFLEX
  ["U"     , "Û"],  # LATIN CAPITAL LETTER U WITH CIRCUMFLEX
  ["I"     , "Î"],  # LATIN CAPITAL LETTER I WITH CIRCUMFLEX
  ["Y"     , "Ŷ"],  # LATIN CAPITAL LETTER Y WITH CIRCUMFLEX
  ["O"     , "Ô"],  # LATIN CAPITAL LETTER O WITH CIRCUMFLEX
  ["Z"     , "Ẑ"],  # LATIN CAPITAL LETTER Z WITH CIRCUMFLEX
  ["z"     , "ẑ"],  # LATIN SMALL LETTER Z WITH CIRCUMFLEX
  ["U+0020", "ˆ"],  # MODIFIER LETTER CIRCUMFLEX ACCENT
]

[[dead_key]]  # Ligatures + North European letters
root = "¦"  # BROKEN BAR
category = "Ligatures + North European letters"
xkb_leader = "U00A6"
map = [
  ["n"     , "ǌ"],  # LATIN SMALL LETTER NJ
  ["a"     , "æ"],  # LATIN SMALL LETTER AE
  ["d"     , "ǳ"],  # LATIN SMALL LETTER DZ
  ["i"     , "ĳ"],  # LATIN SMALL LIGATURE IJ
  ["t"     , "þ"],  # LATIN SMALL LETTER THORN
  ["o"     , "œ"],  # LATIN SMALL LIGATURE OE
  ["|"     , "¦"],  # BROKEN BAR
  ["N"     , "Ǌ"],  # LATIN CAPITAL LETTER NJ
  ["A"     , "Æ"],  # LATIN CAPITAL LETTER AE
  ["D"     , "Ǳ"],  # LATIN CAPITAL LETTER DZ
