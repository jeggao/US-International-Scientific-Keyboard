name: CI

# Branch work is built through its pull request, and main through push. The
# picture job commits the rebuilt picture back to the branch, so it checks the
# branch out by name rather than the merge commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Generating, checking and linting all take under a second and share a
  # checkout, so they are steps rather than three jobs.
  checks:
    name: Generated files, layout and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The generators and the checks are pure standard library, so these two
      # run before anything is installed -- which is also what proves they
      # still need nothing.
      - name: Regenerate every platform file from the layout source
        run: python tools/generate.py --check
      - name: Check README.md and assets against the layout source
        run: python tools/validate.py --strict

      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check tools
      - name: ruff format
        run: ruff format --check tools
      - name: Spell check the prose
        run: codespell README.md CONTRIBUTING.md tools .github

  tests:
    name: Tool tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # The suite compiles the generated XKB file with xkbcomp and asserts the
      # .klc encoding, which used to be two CI jobs of their own. Demanding
      # xkbcomp here means dropping those jobs cannot quietly turn the compile
      # test into a skip.
      KBDLAYOUT_REQUIRE_XKBCOMP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,picture,font]"
      - name: Install the X11 keyboard database so the XKB tests run
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends x11-xkb-utils xkb-data
      - run: pytest

  notebook:
    name: Sandbox notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[notebook]"
      - name: Validate the notebook format
        run: python -c "import nbformat, sys; nbformat.validate(nbformat.read('assets/sandbox.ipynb', as_version=4))"
      - name: Run every cell
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient

          notebook = nbformat.read("assets/sandbox.ipynb", as_version=4)
          NotebookClient(notebook, timeout=120, resources={"metadata": {"path": "assets"}}).execute()
          PY

  picture:
    name: Overview picture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A pull request from this repository, or a push to main, can have the
      # rebuilt picture committed back, so check the branch out by name. A pull
      # request from a fork cannot -- its token is read-only -- so it is taken
      # as it is and only reported on.
      - name: Check out the branch the picture belongs to
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - name: Check out the pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[picture]"
      - name: Install a headless Chromium to rasterise with
        run: playwright install --with-deps chromium

      - name: Rebuild the picture and commit it if it changed
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          python tools/render.py
          if git diff --quiet -- assets/keyboard-layout.png; then
            echo "the picture is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/keyboard-layout.png
          git commit -m "Rebuild the overview picture from the layout"
          # A push made with GITHUB_TOKEN does not start another workflow run,
          # so this cannot loop.
          git push || (git pull --rebase && git push)
      - name: Report whether the picture is current
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: python tools/render.py --check
